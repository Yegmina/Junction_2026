schema_version = "1.4"

[task]
name = "aerorozum/thermal-investigation"
version = "0.3.1"
authors = [{name = "AeroRozum"}]

[metadata]
author_name = "AeroRozum"
description = "Investigate thermal ground signatures with a native Gazebo drone under a flight budget"
difficulty = "hard"
category = "scientific-computing"
tags = ["robotics", "thermal", "investigation", "planning", "gazebo"]

[agent]
timeout_sec = 1800.0
user = "agent"

[verifier]
timeout_sec = 180.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
