<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">AeroRozum thermal research architecture</title>
<desc id="desc">Physics and real annotations support a thermal-camera campaign simulator, Gemini demonstrations and trainable Gemma models. Hidden physical truth travels separately to the privileged evaluator and is never exposed to the acting agent.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d181b"/><stop offset="1" stop-color="#101b19"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1c2c27"/><stop offset="1" stop-color="#14201e"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#b8d99a" stroke-width="1.4"/></marker><marker id="amberArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#d1a87f" stroke-width="1.4"/></marker><style>text{font-family:Inter,Arial,sans-serif}.mono{font-family:monospace}.heading{font-size:22px;fill:#e4ecd9;font-weight:600}.body{font-size:16px;fill:#a8bdb1}.small{font-size:13px;fill:#789487}.label{font-size:11px;fill:#b5d199;letter-spacing:1.5px}.box{fill:url(#panel);stroke:#3a5143;stroke-width:1.3}.line{stroke:#a8c68d;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.truth{stroke:#c49e76;stroke-width:1.7;fill:none;stroke-dasharray:6 5;marker-end:url(#amberArrow)}</style></defs>
<rect width="1600" height="980" rx="18" fill="url(#bg)"/>
<path d="M45 87H1555" stroke="#33463b"/>
<text x="45" y="43" class="label mono">AEROROZUM / RESEARCH SYSTEM</text><text x="45" y="74" fill="#edf3e5" font-size="25" font-weight="500">Learn from evidence. Evaluate against physical truth.</text><text x="1555" y="51" text-anchor="end" class="small mono">GEMMA 4 + HACKATHON GEMINI API</text>
<!-- Boundary labels -->
<text x="45" y="126" class="label mono">INPUTS &amp; PROVENANCE</text><text x="380" y="126" class="label mono">SIMULATED PHYSICS</text><text x="735" y="126" class="label mono">PUBLIC AGENT ENVIRONMENT</text><text x="1090" y="126" class="label mono">LEARNING &amp; INDEPENDENT SCORING</text>
<!-- Sources -->
<rect class="box" x="45" y="157" width="280" height="194" rx="10"/><circle cx="73" cy="188" r="5" fill="#c7e5a1"/><text x="88" y="194" class="heading" font-size="19">Environmental inputs</text><text x="67" y="232" class="body">Sun, sky radiation, weather</text><text x="67" y="262" class="body">Soil, moisture, object properties</text><text x="67" y="292" class="body">Seeds &amp; material provenance</text><text x="67" y="327" class="small">Assumptions remain explicit.</text>
<rect class="box" x="45" y="385" width="280" height="201" rx="10"/><text x="67" y="423" class="heading">Reviewed real data</text><text x="67" y="460" fill="#d9e8ca" font-size="24">752 images · 855 boxes</text><text x="67" y="495" class="body">247 manual / 505 reviewed AI</text><text x="67" y="525" class="body">Whole-zone train / val / test</text><text x="67" y="561" class="small">Flight frames labelled separately</text>
<!-- Physics -->
<rect class="box" x="380" y="181" width="300" height="330" rx="10"/><text x="402" y="220" class="heading">Coupled ground model</text><text x="402" y="256" class="body">DuMux 3.10.0 + DUNE 2.10</text><text x="402" y="286" class="body">Heat + liquid water + vapour</text><text x="402" y="316" class="body">Evaporation / condensation</text><text x="402" y="346" class="body">Buried objects &amp; counterfactuals</text><path d="M402 370H656" stroke="#395044"/><text x="402" y="399" fill="#c1dda7" font-size="14">✓ Upstream regression reproduced</text><text x="402" y="428" fill="#d2b28b" font-size="14">Custom verification: partial</text><text x="402" y="456" class="small">Direct fields and fast generator</text><text x="402" y="480" class="small">are checked and labelled separately.</text>
<!-- Campaign -->
<rect class="box" x="735" y="181" width="300" height="330" rx="10"/><text x="757" y="220" class="heading">Camera + survey world</text><text x="757" y="256" class="body">Radiance → optics → image</text><text x="757" y="286" class="body">640 × 512 thermal observations</text><text x="757" y="316" class="body">Six sorties across a virtual day</text><text x="757" y="346" class="body">Move · capture · revisit · report</text><path d="M757 370H1011" stroke="#395044"/><text x="757" y="400" fill="#c1dda7" font-size="14">Agent sees public observations only</text><text x="757" y="429" class="small">Finite time, battery &amp; action budget</text><text x="757" y="455" class="small">No future frames or hidden targets</text><text x="757" y="481" class="small">MCP / shared Python environment</text>
<!-- Gemma -->
<rect class="box" x="1090" y="181" width="360" height="330" rx="10"/><text x="1112" y="220" class="heading">Gemma 4 · trainable agent</text><text x="1112" y="257" class="body">12B primary · 31B reference</text><text x="1112" y="287" class="body">Separate detection &amp; survey policies</text><text x="1112" y="317" class="body">Base → LoRA SFT → GRPO</text><text x="1112" y="347" class="body">Full study: three seeds planned</text><path d="M1112 370H1428" stroke="#395044"/><text x="1112" y="400" fill="#c1dda7" font-size="13">Measured pilot: 68 SFT + 32 GRPO updates</text><text x="1112" y="429" class="small">Physics study awaits numerical acceptance.</text><text x="1112" y="455" class="small">Real-transfer machine labels stay separate.</text><text x="1112" y="481" class="small">No improvement claimed before evaluation.</text>
<!-- Main arrows -->
<path class="line" d="M325 260H374"/><path class="line" d="M680 270H728"/><path class="line" d="M1035 270H1083"/>
<!-- Real data camera match -->
<path class="line" d="M325 457H351V553H715V456H728" stroke-dasharray="4 4"/><rect x="405" y="540" width="233" height="25" rx="4" fill="#14211e"/><text x="416" y="558" class="small" fill="#acc495">Camera appearance + approved labels</text>
<!-- Teacher -->
<rect class="box" x="735" y="623" width="300" height="174" rx="10"/><text x="757" y="660" class="heading">Gemini · hackathon API</text><text x="757" y="697" class="body">Visible-evidence teacher / reviewer</text><text x="757" y="727" font-size="14" fill="#a8bdb1">ER2 labels + survey demonstrations</text><text x="757" y="771" class="small">Generated annotations retain provenance.</text><path class="line" d="M880 511V616"/><text x="894" y="589" class="small">Public images</text><path class="line" d="M1035 687H1064V425H1083"/><text x="1054" y="614" transform="rotate(-90 1054 614)" class="small">Supervised examples</text>
<!-- evaluator -->
<rect x="1090" y="623" width="360" height="174" rx="10" fill="#28251f" stroke="#94734d" stroke-width="1.3"/><text x="1112" y="660" class="heading">Privileged evaluator</text><text x="1112" y="697" fill="#cbb495" font-size="16">One-to-one evidence matching</text><text x="1112" y="727" fill="#cbb495" font-size="16">Unique-object F2 + qualified coverage</text><text x="1112" y="771" fill="#a78d6c" font-size="13">Hidden truth never enters the agent prompt.</text><path class="line" d="M1260 511V616"/><text x="1274" y="589" class="small">Submitted evidence</text>
<!-- Dashboard -->
<rect class="box" x="45" y="650" width="620" height="147" rx="10"/><text x="67" y="687" class="heading">Visible, reproducible research</text><text x="67" y="723" class="body">3D campaign · original thermal frames · evidence · job state</text><text x="67" y="753" class="body">Captured logs, numerical checks, model calls &amp; checkpoints</text><text x="67" y="779" class="small">Evaluator view is explicitly guarded; demo visuals remain labelled.</text>
<!-- Truth path -->
<path class="truth" d="M680 455H705V865H1482V710H1457"/><rect x="573" y="850" width="690" height="30" rx="5" fill="#201f1a"/><text x="592" y="870" fill="#d1ae82" font-size="13" class="mono">PRIVATE: physical identities, projected signatures &amp; observability certificate</text>
<path d="M45 912H1555" stroke="#33463b"/><text x="45" y="945" class="small mono">RESEARCH INVARIANT</text><text x="250" y="945" class="body">Numerical verification ≠ field validation. Teacher output ≠ ground truth. Planned counts ≠ measured results.</text>
</svg>
